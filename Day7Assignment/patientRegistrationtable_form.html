<!DOCTYPE html>
<html>
<head>
    <title>Hospital Patient Registration</title>
</head>
<body>

<h1 align="center">Hospital Patient Registration</h1>
<p>Apollo Hospital patient registration system</p>

<form action="#" method="post">

    <label>Patient ID:</label>
    <input type="text" name="patientid"><br><br>

    <label>Patient Name:</label>
    <input type="text" name="patientname"><br><br>

    <label>Age:</label>
    <input type="number" name="age"><br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <input type="radio" name="gender" value="Other"> Other
    <br><br>

    <label>Blood Group:</label>
    <select name="bloodgroup">
        <option>Select Blood Group</option>
        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>AB+</option>
        <option>AB-</option>
        <option>O+</option>
        <option>O-</option>
    </select>
    <br><br>

    <label>Doctor:</label>
    <select name="doctor">
        <option>Select Doctor</option>
        <option>Dr. Raj</option>
        <option>Dr. Priya</option>
        <option>Dr. Kumar</option>
    </select>
    <br><br>

    <label>Appointment Date:</label>
    <input type="date" name="appointment"><br><br>

    <label>Symptoms:</label><br>
    <textarea name="symptoms" rows="4" cols="30"></textarea>
    <br><br>

    <label>Medical Report Upload:</label>
    <input type="file" name="report"><br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

</form>

<br><br>

<h2>Patient Details</h2>

<table border="1" cellpadding="10">
    <thead>
        <tr>
            <th>Patient ID</th>
            <th>Patient Name</th>
            <th>Doctor</th>
            <th>Blood Group</th>
            <th>Appointment Date</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>P101</td>
            <td>Sonia</td>
            <td>Dr. Raj</td>
            <td>O+</td>
            <td>23-07-2026</td>
            <td>Confirmed</td>
        </tr>
    </tbody>
</table>

</body>
</html>
