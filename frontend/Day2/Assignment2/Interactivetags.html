<!DOCTYPE html>
<html>
    <head>
        <title>Interactive tag</title>
    </head>
<body>
    <h1>Interactive tags</h1>
    <p>
        <a>Click Here</a>
     </p>
     <p>
        <button>Click Me</button>
     </p>
     <p>
        <input type="text"
        placeholder="Enter your name">
     </p>
     <p>
        <label>Select a course:</label>
     </p>
     <p>
        <select>
            <option>HTML</option>
            <option>CSS</option>
            <option>javascript</option>
        </select>
     </p>
</body>
</html>
