<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media showcase webpage</title>
</head>
<body>
    <header>
        <h1>Media showcase</h1>
        </header>
        <main>
            <section>
                <h2>image</h2>
                <img src="Image2.jpg" alt="image1" width="200" height="150">
                <img src="Image3.jpg" alt="image2" width="200" height="150">
                <img src="Image4.jpg" alt="image3" width="200" height="150">
            </section>
            <section>
                <h2>Audio</h2>
                <audio controls>
                    <source src="songplayer2.mp3" type="audio/mpeg">
                </audio>
                </section>
            <section>
                <h2>video</h2>
                <video controls>
                    <source src="videoplayer2.mp4" type="video/mp4">
                </video>
            </section>
            <section>
                <h2>YouTube video</h2>
                <iframe width="500" height="300"
                src="https://www.youtube.com/embed/cNGjD0VG4R8?si=-QBEvalIVA5Ky1Z4" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </section>
            <section>
                <h2>Google map</h2>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3886.8817897694275!2d80.20289347405182!3d13.04319561330663!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a5266d123c605d7%3A0x4e67aca534a22fbe!2sSSR%20Women&#39;s%20Hostel!5e0!3m2!1sen!2sin!4v1785141687908!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </section>
            <section>
                <h2>Embedded pdf</h2>
                <iframe src="resume.pdf" width="400" height="350"></iframe>
            </section>
         </main>

    
    
</body>
</html>
