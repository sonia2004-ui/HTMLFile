<!DOCTYPE html>
<html>
<head>
    <title>College Admission Form</title>
</head>
<body>

<h1 align="center">College Admission Form</h1>

<form action="#" method="post">

    <label>Student Name:</label>
    <input type="text" name="studentname"><br><br>

    <label>Father Name:</label>
    <input type="text" name="fathername"><br><br>

    <label>Mother Name:</label>
    <input type="text" name="mothername"><br><br>

    <label>Email:</label>
    <input type="email" name="email"><br><br>

    <label>Phone:</label>
    <input type="tel" name="phone"><br><br>

    <label>DOB:</label>
    <input type="date" name="dob"><br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <input type="radio" name="gender" value="Other"> Other
    <br><br>

    <label>Department:</label>
    <select name="department">
        <option>Select Department</option>
        <option>CSE</option>
        <option>ECE</option>
        <option>EEE</option>
        <option>Mechanical</option>
    </select>
    <br><br>

    <label>Percentage:</label>
    <input type="number" name="percentage"><br><br>

    <label>Address:</label><br>
    <textarea name="address" rows="4" cols="30"></textarea>
    <br><br>

    <label>Passport Size Photo:</label>
    <input type="file" name="photo"><br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

</form>

<br><br>

<h2>Admission Report</h2>

<table border="1" cellpadding="10">
    <thead>
        <tr>
            <th>Application ID</th>
            <th>Student Name</th>
            <th>Department</th>
            <th>Percentage</th>
            <th>Email</th>
            <th>Admission Status</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>APP101</td>
            <td>Sonia</td>
            <td>ECE</td>
            <td>85%</td>
            <td>sonia@gmail.com</td>
            <td>Approved</td>
        </tr>
    </tbody>
</table>

</body>
</html>
