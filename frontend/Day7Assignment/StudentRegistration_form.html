<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

<h1 align="center">Student Registration Form</h1>
<p>SLA Institute wants to register new students</p>


<form action="#" method="post">

    <label>Student Name:</label>
    <input type="text" name="studentname"><br><br>

    <label>Email:</label>
    <input type="email" name="email"><br><br>

    <label>Password:</label>
    <input type="password" name="password"><br><br>

    <label>Mobile Number:</label>
    <input type="tel" name="mobile"><br><br>

    <label>Age:</label>
    <input type="number" name="age"><br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <input type="radio" name="gender" value="Other"> Other
    <br><br>

    <label>Skills:</label>
    <input type="checkbox" name="skills" value="HTML"> HTML
    <input type="checkbox" name="skills" value="CSS"> CSS
    <input type="checkbox" name="skills" value="JavaScript"> JavaScript
    <br><br>

    <label>Course Selection:</label>
    <select name="course">
        <option>Select Course</option>
        <option>Full Stack</option>
        <option>Python</option>
        <option>Java</option>
        <option>Data Science</option>
    </select>
    <br><br>

    <label>Address:</label><br>
    <textarea name="address" rows="4" cols="30"></textarea>
    <br><br>

    <label>Profile Image:</label>
    <input type="file" name="image">
    <br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

</form>

<br><br>

<h2>Student Details Table</h2>

<table border="1" cellpadding="10">

    <thead>
        <tr>
            <th>SLA ID</th>
            <th>Student Name</th>
            <th>Course</th>
            <th>Email</th>
            <th>Mobile Number</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>101</td>
            <td>Sonia</td>
            <td>Full Stack</td>
            <td>sonia@gmail.com</td>
            <td>9876543210</td>
            <td>Active</td>
        </tr>
    </tbody>

</table>

</body>
</html>
