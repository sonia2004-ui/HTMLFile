<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>

    <h2>Feedback Form</h2>

    <form action="#" method="post">

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label>Rating:</label><br>
        <input type="radio" id="excellent" name="rating" value="Excellent">
        <label for="excellent">Excellent</label>

        <input type="radio" id="good" name="rating" value="Good">
        <label for="good">Good</label>

        <input type="radio" id="average" name="rating" value="Average">
        <label for="average">Average</label><br><br>

        <label>Suggestions:</label><br>
        <textarea id="suggestion" name="suggestion" rows="5" cols="30"></textarea><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
